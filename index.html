<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Gym Coach</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0c0d0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gym Coach">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0c0d0f;--card:#15171a;--card2:#1d2024;--line:#2a2e34;--tx:#f2f2ee;--mut:#8f959c;--acc:#d6ff3d;--acc-d:#2b3310;--acc2:#ff7a3d;--ok:#46d483;--ok-d:#13301f;--bad:#ff5c5c;--r:16px;
--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 Inter,system-ui,-apple-system,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--acc)}
.h{font-family:'Barlow Condensed',Inter,sans-serif;text-transform:uppercase;letter-spacing:.02em;font-weight:700}
.mut{color:var(--mut)}.small{font-size:13px}.tiny{font-size:12px}
.acc{color:var(--acc)}.warn{color:var(--acc2)}
.hidden{display:none!important}
header.top{position:sticky;top:0;z-index:20;background:rgba(12,13,15,.92);backdrop-filter:blur(10px);padding:calc(10px + var(--st)) 18px 10px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
header.top .logo{font-size:24px;line-height:1}
header.top .logo b{color:var(--acc)}
.sync{margin-left:auto;font-size:11px;color:var(--mut);display:flex;align-items:center;gap:6px;white-space:nowrap}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--mut);display:inline-block}
.sync.ok i{background:var(--ok)}.sync.warn i{background:var(--acc2)}
.iconbtn{background:var(--card2);border:1px solid var(--line);border-radius:12px;width:38px;height:38px;display:grid;place-items:center;flex:none}
main{max-width:640px;margin:0 auto;padding:6px 16px calc(96px + var(--sb))}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(18,20,23,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 6px calc(6px + var(--sb))}
nav.tabs button{flex:1;max-width:130px;background:none;border:0;padding:6px 0;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--mut);font-size:11px;font-weight:600}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button.on{color:var(--acc)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:12px 0}
.card.hero{background:linear-gradient(160deg,#1b1f12 0%,#15171a 55%);border-color:#3a4416}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.title{font-size:34px;line-height:1;margin:6px 0 4px}
.sec{font-size:22px;margin:22px 0 4px}
.row{display:flex;gap:10px;align-items:center}
.grow{flex:1}
.btn{border:1px solid var(--line);background:var(--card2);border-radius:12px;padding:12px 16px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#111;font-weight:800}
.btn.big{width:100%;padding:16px;font-size:17px}
.btn.ghost{background:transparent}
.btn.sm{padding:7px 11px;font-size:13px;border-radius:10px}
.btn.danger{color:var(--bad);border-color:#4a2222}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:12px;font-weight:600}
.pill.acc{background:var(--acc-d);border-color:#46531a;color:var(--acc)}
.exlist{list-style:none;padding:0;margin:10px 0 14px}
.exlist li{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.exlist li:last-child{border-bottom:0}
.exlist .sr{color:var(--mut);white-space:nowrap;font-variant-numeric:tabular-nums}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--card2);border-radius:12px;padding:12px}
.stat .v{font-family:'Barlow Condensed',Inter,system-ui,sans-serif;font-weight:700;font-size:28px;line-height:1}
.stat .l{font-size:11px;color:var(--mut);margin-top:4px;text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.weekdots{display:flex;gap:8px;margin-top:10px}
.weekdots span{flex:1;height:8px;border-radius:4px;background:var(--card2);border:1px solid var(--line)}
.weekdots span.on{background:var(--acc);border-color:var(--acc)}
label.f{display:block;margin:12px 0}
label.f>span{display:block;font-size:12px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
input,select,textarea{background:var(--card2);border:1px solid var(--line);color:var(--tx);border-radius:12px;padding:12px;font:inherit;font-size:16px;width:100%;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--acc)}
textarea{min-height:70px;resize:vertical}
.seg{display:flex;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:none;padding:10px;border-radius:9px;font-weight:700;color:var(--mut)}
.seg button.on{background:var(--acc);color:#111}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
details.acc-item{background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin:10px 0;overflow:hidden}
details.acc-item>summary{list-style:none;padding:16px;display:flex;align-items:center;gap:10px;font-weight:700;cursor:pointer}
details.acc-item>summary::-webkit-details-marker{display:none}
details.acc-item>summary:after{content:'+';margin-left:auto;color:var(--mut);font-size:20px}
details.acc-item[open]>summary:after{content:'–'}
details.acc-item .body{padding:0 16px 16px}
.check{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.check:last-child{border-bottom:0}
.check input{width:22px;height:22px;flex:none;accent-color:var(--acc);margin-top:1px}
.tip{border-left:3px solid var(--acc);padding:10px 12px;background:var(--card2);border-radius:0 10px 10px 0;margin:10px 0}
/* workout overlay */
.overlay{position:fixed;inset:0;z-index:50;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch}
.overlay .wh{position:sticky;top:0;z-index:5;background:rgba(12,13,15,.95);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:calc(10px + var(--st)) 16px 10px;display:flex;align-items:center;gap:10px}
.overlay .wbody{max-width:640px;margin:0 auto;padding:6px 14px 170px}
.excard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:12px 0}
.excard.complete{border-color:#2c5a3d}
.excard .exh{display:flex;gap:10px;align-items:flex-start}
.exnum{font-family:'Barlow Condensed',Inter,system-ui,sans-serif;font-weight:800;font-size:15px;background:var(--card2);border:1px solid var(--line);border-radius:8px;min-width:30px;height:30px;display:grid;place-items:center;flex:none}
.excard.complete .exnum{background:var(--ok);color:#0b1a10;border-color:var(--ok)}
.exname{font-weight:700;font-size:17px;line-height:1.2}
.sugg{font-size:13px;background:var(--card2);border-radius:10px;padding:9px 11px;margin:10px 0 6px;color:#cfd3d6}
.sugg.up{background:var(--acc-d);color:var(--acc)}
.sugg.down{background:#33200f;color:var(--acc2)}
.sets{display:grid;grid-template-columns:26px 1fr 1fr 62px 48px;gap:6px;align-items:center;margin-top:8px}
.sets .hd{font-size:11px;color:var(--mut);font-weight:700;text-transform:uppercase;letter-spacing:.06em;text-align:center}
.sets .sn{font-family:'Barlow Condensed',Inter,system-ui,sans-serif;font-weight:700;font-size:18px;text-align:center;color:var(--mut)}
.sets select{text-align:center;text-align-last:center;font-size:17px;font-weight:700;padding:11px 2px;-webkit-appearance:none;appearance:none}
.sets select.on{background:var(--ok-d);border-color:#2c5a3d}
.sets input{text-align:center;font-size:19px;font-weight:700;padding:11px 6px;font-variant-numeric:tabular-nums}
.sets .tick{height:48px;border-radius:12px;border:1px solid var(--line);background:var(--card2);display:grid;place-items:center}
.sets .tick svg{width:22px;height:22px;opacity:.45}
.sets .tick.on{background:var(--ok);border-color:var(--ok);color:#0b1a10}
.sets .tick.on svg{opacity:1}
.sets input.on{background:var(--ok-d);border-color:#2c5a3d}
.exbtns{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.timer{position:fixed;left:0;right:0;bottom:0;z-index:60;padding:10px 14px calc(12px + var(--sb));background:rgba(20,22,25,.97);backdrop-filter:blur(10px);border-top:1px solid var(--line);transform:translateY(110%);transition:transform .25s}
.timer{visibility:hidden}.timer.show{transform:none;visibility:visible}
.timer .in{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:10px}
.timer .clock{font-family:'Barlow Condensed',Inter,system-ui,sans-serif;font-weight:800;font-size:44px;line-height:1;font-variant-numeric:tabular-nums;min-width:110px}
.timer .bar{height:4px;background:var(--card2);border-radius:2px;margin:0 auto 8px;max-width:640px;overflow:hidden}
.timer .bar i{display:block;height:100%;background:var(--acc);width:0}
.timer.go .clock{color:var(--acc)}
.timer.go{animation:flash 1s 3}
@keyframes flash{50%{background:#2b3310}}
/* sheet */
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:80}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:90;background:var(--card);border-top:1px solid var(--line);border-radius:20px 20px 0 0;max-height:88vh;overflow-y:auto;padding:8px 18px calc(22px + var(--sb))}
.sheet .grab{width:42px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 10px}
.sheet .in{max-width:640px;margin:0 auto}
.sheet ol,.sheet ul{padding-left:20px}
.sheet li{margin:6px 0}
.toast{position:fixed;left:50%;top:calc(70px + var(--st));transform:translateX(-50%);background:var(--acc);color:#111;font-weight:700;padding:10px 16px;border-radius:12px;z-index:100;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1}
.chart{width:100%;height:auto;display:block}
.habitbar{display:flex;gap:6px;margin:14px 0 4px}
.habitbar span{flex:1;height:10px;border-radius:5px;background:var(--card2);border:1px solid var(--line)}
.habitbar span.on{background:var(--acc);border-color:var(--acc)}
.habitbar span.half{background:linear-gradient(90deg,var(--acc) 50%,var(--card2) 50%);border-color:#46531a}
.seg.s5 button{padding:9px 0}
.iconbtn[disabled]{opacity:.3}
.demo{width:100%;border-radius:12px;display:block;background:#000;aspect-ratio:3/2;object-fit:cover}
.thumb{width:92px;height:62px;border-radius:9px;object-fit:cover;flex:none;background:#000;border:1px solid var(--line);cursor:pointer}
.thumb.s{width:66px;height:44px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:4px 0 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;border:1px solid var(--line);background:var(--card2);border-radius:999px;padding:8px 14px;font-weight:700;color:var(--mut)}
.chips button.on{background:var(--acc);border-color:var(--acc);color:#111}
.chips button.td{border-color:var(--tx)}
.meal{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}
.meal:last-child{border-bottom:0}
.meal input[type=checkbox]{width:24px;height:24px;flex:none;accent-color:var(--acc);margin-top:2px}
.meal.eaten .mn{text-decoration:line-through;color:var(--mut)}
.mbar{margin:8px 0}
.mbar .t{display:flex;justify-content:space-between;font-size:12px;font-weight:600}
.mbar .b{height:8px;border-radius:4px;background:var(--card2);overflow:hidden;margin-top:4px;position:relative}
.mbar .b i{display:block;height:100%;background:var(--acc);border-radius:4px}
.mbar .b i.e{position:absolute;left:0;top:0;background:var(--ok);opacity:.9}
.mbar.over .b i{background:var(--acc2)}
.spin{display:inline-block;width:16px;height:16px;border:2px solid #111;border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.heat{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:8px}
.heat div{aspect-ratio:1;border-radius:7px;background:var(--card2);font-size:10px;display:grid;place-items:center;color:var(--mut);font-weight:600}
.heat .dh{background:none;aspect-ratio:auto;font-size:10px}
.heat div.today{outline:2px solid var(--tx);outline-offset:-2px}
.chart text{fill:var(--mut);font-size:10px;font-family:Inter}
.histitem{padding:12px 0;border-bottom:1px solid var(--line)}
.histitem:last-child{border-bottom:0}
.lib-item{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);gap:10px;background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left}
.kv{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)}
.kv:last-child{border-bottom:0}
.kv b{font-variant-numeric:tabular-nums}
.macro{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.bars{display:flex;align-items:flex-end;gap:5px;height:80px;margin-top:10px}
.bars div{flex:1;background:var(--card2);border-radius:5px 5px 2px 2px;position:relative;min-height:4px}
.bars div.on{background:var(--acc)}
.bars div span{position:absolute;bottom:-18px;left:0;right:0;text-align:center;font-size:10px;color:var(--mut)}
table.plan{width:100%;border-collapse:collapse;font-size:14px}
table.plan td{padding:7px 0;border-bottom:1px solid var(--line);vertical-align:top}
table.plan td:last-child{text-align:right;color:var(--mut);white-space:nowrap;padding-left:10px}
</style>
</head>
<body>
<header class="top">
  <div class="logo h">Gym<b>.</b>Coach</div>
  <div class="sync" id="sync"><i></i><span>Loading…</span></div>
  <button class="iconbtn" data-act="settings" aria-label="Settings"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
</header>
<main id="view"></main>
<nav class="tabs" id="tabs">
  <button data-tab="today" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 6.5h11M6.5 17.5h11M4 9v6M20 9v6M2 11v2M22 11v2M6.5 6.5v11M17.5 6.5v11"/></svg>Today</button>
  <button data-tab="plan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>Plan</button>
  <button data-tab="meals"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 3v7a3 3 0 0 0 6 0V3M7 3v18M17 3c-2 2-3 4.5-3 8h3v10"/></svg>Meals</button>
  <button data-tab="progress"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/></svg>Progress</button>
  <button data-tab="guide"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5z"/><path d="M4 19.5V21h16"/></svg>Guide</button>
</nav>
<div id="workout" class="overlay hidden"></div>
<div id="timer" class="timer"><div class="bar"><i id="tbar"></i></div><div class="in">
  <div><div class="eyebrow" id="tlabel">Rest</div><div class="clock" id="tclock">0:00</div></div>
  <div class="grow"></div>
  <button class="btn sm" data-act="t-15">−15s</button>
  <button class="btn sm" data-act="t+15">+15s</button>
  <button class="btn sm pri" data-act="tskip">Done</button>
</div></div>
<div id="sheetwrap" class="hidden"><div class="backdrop" data-act="closesheet"></div><div class="sheet"><div class="grab"></div><div class="in" id="sheet"></div></div></div>
<div class="toast" id="toast"></div>

<script>
'use strict';
/* =========================================================
   EXERCISE LIBRARY
   t: c = compound, i = isolation · inc = load jump (kg) · rest (s)
   bw = bodyweight ok · timed = seconds · assist = counterweight (less = harder)
   ========================================================= */
const EX={
leg_press:{n:'Leg Press',fr:'Presse à cuisses',m:'Quads, glutes',t:'c',inc:10,rest:120,
 start:'First time: start with roughly 40–60 kg on the sled. Pick a load you could push 15+ times, then do the prescribed reps.',
 cues:['Feet shoulder-width, middle of the platform','Lower until knees reach about 90°, lower back stays flat on the pad','Push through the whole foot; don\'t slam the knees locked at the top'],
 err:['Hips peeling off the seat at the bottom → go less deep','Knees caving inward'],swaps:['hack_squat','goblet_squat']},
chest_press:{n:'Machine Chest Press',fr:'Développé couché machine',m:'Chest, front delts, triceps',t:'c',inc:5,rest:105,
 start:'Set the seat so the handles line up with mid-chest. Start very light (10–20 kg) for set 1 and adjust.',
 cues:['Shoulder blades pulled back and down into the pad','Handles at mid-chest height, elbows ~45° from the body','Press out, then 2–3 s controlled return'],
 err:['Seat too low → handles at shoulder height, stresses shoulders','Shoulders rolling forward at the end of each rep'],swaps:['db_bench','bench_press','pushup']},
lat_pulldown:{n:'Lat Pulldown',fr:'Tirage vertical',m:'Lats, upper back, biceps',t:'c',inc:5,rest:105,
 start:'Start around 25–35 kg. Lock your thighs under the pad.',
 cues:['Grip slightly wider than shoulders','Lead with the elbows: pull the bar to the top of the chest','Lean back only slightly; control the bar up'],
 err:['Yanking with the whole body','Pulling the bar behind the neck'],swaps:['assisted_pullup','cable_row']},
leg_curl_seated:{n:'Seated Leg Curl',fr:'Leg curl assis',m:'Hamstrings',t:'i',inc:5,rest:75,
 start:'Start around 20–30 kg. Knee joint lines up with the machine\'s pivot.',
 cues:['Knees aligned with the pivot, thigh pad snug','Curl down fully, squeeze 1 s','Slow return — don\'t let the stack crash'],
 err:['Hips lifting off the seat','Half reps'],swaps:['lying_leg_curl']},
db_shoulder_press:{n:'Seated DB Shoulder Press',fr:'Développé épaules haltères',m:'Shoulders, triceps',t:'c',inc:2,rest:105,
 start:'Start with 8–10 kg dumbbells. Bench upright (around 80–90°).',
 cues:['Back against the bench, feet planted','Dumbbells start at ear level, palms forward','Press up and slightly in, don\'t clang them'],
 err:['Arching the lower back off the bench','Dropping the elbows way below ear level with heavy weight'],swaps:['machine_shoulder_press']},
machine_shoulder_press:{n:'Machine Shoulder Press',fr:'Développé épaules machine',m:'Shoulders, triceps',t:'c',inc:5,rest:105,
 start:'Start light (10–20 kg). Handles at shoulder height at the start.',
 cues:['Back flat against the pad','Press straight up without locking hard','2 s controlled lowering'],
 err:['Seat too high or low','Arching the lower back'],swaps:['db_shoulder_press']},
plank:{n:'Plank',fr:'Gainage',m:'Core',t:'i',timed:true,bw:true,rest:60,
 start:'Hold a solid position for 20–30 s. Quality over time.',

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const isoOf=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const todayISO=()=>isoOf(new Date());
const dOf=iso=>{const[a,b,c]=iso.split('-').map(Number);return new Date(a,b-1,c)};
const fmtD=iso=>dOf(iso).toLocaleDateString('en-GB',{day:'numeric',month:'short'});
const fmtW=w=>{if(w===''||w==null||isNaN(w))return '';const n=Math.round(+w*100)/100;return String(n)};
const num=v=>{if(v===''||v==null)return NaN;return parseFloat(String(v).replace(',','.'))};
const clone=o=>JSON.parse(JSON.stringify(o));
const r50=x=>Math.round(x/50)*50;const r5=x=>Math.round(x/5)*5;
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),2200)}
function mondayOf(iso){const d=dOf(iso);const k=(d.getDay()+6)%7;d.setDate(d.getDate()-k);return isoOf(d)}

const LS='gym_coach_v1';
let S={profile:null,body:[],notes:{},checks:{},daily:{},sessions:{},deleted:{},draft:null,meal:null,pUpdated:0,dUpdated:0};
function lsLoad(){try{const r=localStorage.getItem(LS);if(r){const o=JSON.parse(r);Object.assign(S,o)}}catch(e){}}
function lsSave(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}}
const R={db:null,uid:null,status:'loading'};
const pRef=()=>R.db.doc('data/users/'+R.uid+'/profile');
const dRef=()=>R.db.doc('data/users/'+R.uid+'/draft');
const sCol=()=>pRef().collection('sessions');
const mRef=()=>R.db.doc('shared/mealplan');
function saveMeal(){if(S.meal)S.meal.updatedAt=Date.now();lsSave();if(R.db&&S.meal)debounce('m',1500,()=>{const b=clone(S.meal);queue('m',()=>mRef().set(b))})}
const chains={},timers={};
function queue(k,fn){chains[k]=(chains[k]||Promise.resolve()).then(fn).then(()=>{if(R.status!=='ok')setStatus('ok')}).catch(e=>{console.warn('sync',e);setStatus(e&&e.code==='quota_exceeded'?'full':'err')});return chains[k]}
function debounce(k,ms,fn){clearTimeout(timers[k]);timers[k]=setTimeout(fn,ms)}
function pushProfile(){if(!R.db)return;const body={profile:S.profile,body:S.body,notes:S.notes,checks:S.checks,daily:S.daily,deleted:S.deleted,updatedAt:S.pUpdated};queue('p',()=>pRef().set(clone(body)))}
function saveProfile(){S.pUpdated=Date.now();lsSave();if(R.db)debounce('p',1200,pushProfile)}
function saveDraft(immediate){S.dUpdated=Date.now();lsSave();if(!R.db)return;const go=()=>{const b={draft:S.draft?clone(S.draft):null,updatedAt:S.dUpdated};queue('d',()=>dRef().set(b))};immediate?(clearTimeout(timers.d),go()):debounce('d',2500,go)}
function saveSession(s){S.sessions[s.id]=s;lsSave();if(R.db)queue('s'+s.id,()=>sCol().doc(s.id).set(clone(s)))}
function deleteSession(id){delete S.sessions[id];S.deleted[id]=1;saveProfile();if(R.db)queue('s'+id,()=>sCol().doc(id).delete())}
function setStatus(s){R.status=s;const el=$('#sync');const map={loading:['Loading…',''],sync:['Syncing…',''],ok:['Synced','ok'],local:['Saved on this device','warn'],slow:['Offline · saving on device','warn'],err:['Sync issue · saved on device','warn'],full:['Cloud storage full','warn']};const[m,c]=map[s]||map.local;el.className='sync '+c;el.querySelector('span').textContent=m}

async function initRemote(){
  if(!window.claude||typeof window.claude.use!=='function'){setStatus('local');return}
  setStatus('sync');
  const to=setTimeout(()=>{if(R.status==='sync')setStatus('slow')},10000);
  try{
    const[db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
    const uid=user?await user.id():null;
    if(!db||!uid){clearTimeout(to);setStatus('local');return}
    R.db=db;R.uid=uid;
    const[ps,ds,ss]=await Promise.all([pRef().get(),dRef().get(),sCol().get()]);
    clearTimeout(to);
    let changed=false;
    if(ps.exists){const d=ps.data()||{};
      if((d.updatedAt||0)>(S.pUpdated||0)){S.profile=d.profile?clone(d.profile):null;S.body=clone(d.body||[]);S.notes=clone(d.notes||{});S.checks=clone(d.checks||{});S.daily=clone(d.daily||{});S.deleted=Object.assign({},S.deleted,clone(d.deleted||{}));S.pUpdated=d.updatedAt;changed=true}
      else if(S.profile&&(S.pUpdated||0)>(d.updatedAt||0))pushProfile();
    }else if(S.profile)pushProfile();
    if(ds.exists){const d=ds.data()||{};if((d.updatedAt||0)>(S.dUpdated||0)){S.draft=d.draft?clone(d.draft):null;S.dUpdated=d.updatedAt;changed=true}else if((S.dUpdated||0)>(d.updatedAt||0))saveDraft(true)}
    else if(S.draft)saveDraft(true);
    const remote=new Set();
    ss.docs.forEach(doc=>{remote.add(doc.id);if(S.deleted[doc.id]){queue('s'+doc.id,()=>sCol().doc(doc.id).delete());return}if(!S.sessions[doc.id]){S.sessions[doc.id]=clone(doc.data());changed=true}});
    Object.keys(S.sessions).forEach(id=>{if(!remote.has(id)){const s=S.sessions[id];queue('s'+id,()=>sCol().doc(id).set(clone(s)))}});
    if(S.draft&&S.sessions[S.draft.id]){S.draft=null;saveDraft(true);changed=true}
    try{mRef().onSnapshot(sn=>{if(!sn.exists)return;const d=sn.data();if(d&&Array.isArray(d.days)&&(d.updatedAt||0)>((S.meal&&S.meal.updatedAt)||0)){const v=validPlan(clone(d));if(v){v.updatedAt=d.updatedAt;S.meal=v;lsSave();if(TAB==='meals')renderAll();}}},()=>{})}catch(e){}
    if(S.meal){const ms=await mRef().get();if(!ms.exists||((ms.data()||{}).updatedAt||0)<S.meal.updatedAt){const b=clone(S.meal);queue('m',()=>mRef().set(b))}}
    if(migrate())changed=true;
    lsSave();setStatus('ok');
    if(changed)renderAll();
  }catch(e){clearTimeout(to);console.warn(e);setStatus(R.db?'err':'local')}
}

/* =========================================================
   PROGRAM LOGIC
   ========================================================= */
const sessionsSorted=()=>Object.values(S.sessions).sort((a,b)=>(a.finishedAt||0)-(b.finishedAt||0));
function weekFloat(){return sessionsSorted().reduce((a,s)=>a+1/(s.mode||3),0)}
function curWeek(){return Math.floor(weekFloat()+1e-6)+1}
const phaseOf=w=>w<=4?1:2;
function progWeek(){return Math.min(curWeek(),12)}
function nextWorkoutId(){
  const mode=S.profile.days,ph=phaseOf(curWeek()),rot=ROT[mode][ph];
  const last=sessionsSorted().filter(s=>s.mode==mode&&s.phase==ph).pop();
  if(!last)return rot[0];
  const i=rot.indexOf(last.workoutId);return rot[(i+1)%rot.length];
}
const setsFor=(n,w)=>w<=2?Math.max(2,n-1):n;
function cardioFor(w){return w<=2?{min:10,txt:'10 min incline walk (treadmill 6–8% incline, ~5 km/h)'}:w<=4?{min:12,txt:'12 min incline walk (8–10% incline, 5–5.5 km/h)'}:{min:20,txt:'15–20 min incline walk or easy bike: you can talk, but not sing'}}
const stepsFor=w=>w<=2?7000:w<=4?8000:10000;
function rirT(w,E){return w<=2?{t:3,txt:'3–4'}:w<=4?{t:2,txt:'2–3'}:(E&&E.t==='i')?{t:1,txt:'0–1'}:{t:2,txt:'1–2'}}
function rirFor(w){return w<=2?'Target 3–4 RIR on every set: stop when you could still do 3–4 clean reps. You\'re learning the movements.':w<=4?'Target 2–3 RIR: finish each set with 2–3 clean reps still in you.':'Target 1–2 RIR on compound lifts and 0–1 on isolation. Never grind squat, bench or deadlift to failure.'}

function lastPerf(id,before){
  const out=[];const list=sessionsSorted().reverse();
  for(const s of list){if(before&&s.finishedAt>=before)continue;
    for(const e of s.ex||[]){if(e.id===id){const d=(e.sets||[]).filter(x=>x.done&&num(x.r)>0);if(d.length){out.push({date:s.date,sets:d,lo:e.lo,hi:e.hi});break}}}
    if(out.length>=6)break}
  return out;
}
function stepOf(E){const i=E.inc||1;return i>=5?2.5:i>=2?1:0.5}
function roundTo(x,st){return Math.round(x/st)*st}
function suggest(id,lo,hi){
  const E=EX[id],h=lastPerf(id);
  if(!h.length)return{w:null,targets:null,kind:'new',msg:E.start};
  const L=h[0];
  if(E.timed){const best=Math.max(...L.sets.map(s=>num(s.r)||0));const t=Math.min(hi+15,best+5);return{w:null,targets:L.sets.map(()=>t),kind:'same',msg:`Last time: best hold ${best} s. Aim for ${t} s on each set.`}}
  const w=Math.max(...L.sets.map(s=>num(s.w)||0));
  const atW=L.sets.filter(s=>(num(s.w)||0)===w);
  const reps=L.sets.map(s=>num(s.r));
  const T=rirT(progWeek(),E),rl=atW.map(s=>s.rir===''||s.rir==null?NaN:num(s.rir)),rAll=rl.length>0&&rl.every(x=>!isNaN(x)),rMin=rAll?Math.min(...rl):null,rLast=rl.length&&!isNaN(rl[rl.length-1])?rl[rl.length-1]:null;
  const lastTxt=`Last (${fmtD(L.date)}): ${w>0?fmtW(w)+' kg':'bodyweight'} × ${reps.join(', ')}${rLast!=null?` · last set ${rLast>=5?'5+':rLast} RIR`:''}`;
  const allTop=atW.length>=Math.min(2,L.sets.length)&&atW.every(s=>num(s.r)>=hi);
  if(allTop){
    if(E.bw&&w===0)return{w:0,targets:null,kind:'up',msg:`${lastTxt}. Top of the range on every set → make it harder: hold a dumbbell or slow the lowering to 3 s.`};
    if(E.assist){const nw=Math.max(0,w-(E.inc||5));return{w:nw,targets:null,kind:'up',msg:`${lastTxt}. Top of the range → less assistance: ${fmtW(nw)} kg, aim for ${lo}+ reps.`}}
    const nw=w+(E.inc||2.5);return{w:nw,targets:null,kind:'up',msg:`${lastTxt}. Top of the range on every set → add weight: ${fmtW(nw)} kg, aim for ${lo}+ reps.`};
  }
  const below=atW.some(s=>num(s.r)<lo);
  if(!below&&rAll&&rMin>=T.t+2&&!(E.bw&&w===0)){const nw=E.assist?Math.max(0,w-(E.inc||5)):w+(E.inc||2.5);
    return{w:nw,targets:null,kind:'up',msg:`${lastTxt}. Every set had ${rMin>=5?'5+':rMin} reps in reserve against a target of ${T.txt} → too light: go to ${fmtW(nw)} kg${E.assist?' assistance':''}, aim for ${lo}+ reps.`}}
  if(below&&h[1]){const pw=Math.max(...h[1].sets.map(s=>num(s.w)||0));if(pw===w&&h[1].sets.some(s=>num(s.r)<lo)&&w>0){
    const nw=E.assist?w+(E.inc||5):Math.max(0,roundTo(w*0.9,stepOf(E)));
    return{w:nw,targets:null,kind:'down',msg:`${lastTxt}. Below ${lo} reps two sessions running → ${E.assist?'add assistance':'drop ~10%'} to ${fmtW(nw)} kg and build back up. Planned, not failure.`}}}
  if(rAll&&rMin===0&&T.t>=2)return{w,targets:reps.map(r=>Math.max(lo,Math.min(hi,r||lo))),kind:'same',msg:`${lastTxt}. You hit failure (0 RIR) and the target is ${T.txt}. Same weight, same reps, and stop each set earlier.`};
  const targets=reps.map(r=>Math.max(lo,Math.min(hi,(r||lo)+1)));
  return{w,targets,kind:'same',msg:`${lastTxt}. Same weight: beat at least one set by a rep${rLast==null?', and log RIR so the next suggestion is sharper':''}.`};
}
const e1rm=(w,r)=>(w>0&&r>0)?w*(1+Math.min(r,12)/30):0;

/* nutrition */
function latestWeight(){const b=[...S.body].filter(x=>x.w).sort((a,b)=>a.d<b.d?-1:1);return b.length?num(b[b.length-1].w):num(S.profile&&S.profile.weight)}
function targets(){
  const p=S.profile;if(!p)return null;const w=latestWeight(),h=num(p.height),a=num(p.age);if(!(w>0&&h>0&&a>0))return null;
  const bmi=w/((h/100)**2);const bmr=10*w+6.25*h-5*a+(p.sex==='f'?-161:5);
  const tdee=bmr*(p.days==4?1.55:1.45);const def=bmi>=27?500:bmi>=24?350:200;
  const kcal=r50(Math.max(bmr*1.05,tdee-def));const ref=bmi>25?25*(h/100)**2:w;
  const protein=r5(2*ref),fat=r5(0.8*ref),carbs=Math.max(0,r5((kcal-protein*4-fat*9)/4));
  return{kcal,protein,fat,carbs,tdee:r50(tdee),bmi,def,water:Math.round(w*0.035*10)/10,steps:stepsFor(progWeek())};
}

/* daily habits */
let DAY=todayISO();
function waterT(){const t=targets();return t?Math.max(2,Math.round(t.water*2)/2):2.5}
function dayScore(d){if(!d)return 0;let s=0;
  if(num(d.steps)>=stepsFor(progWeek()))s++;if(num(d.sleep)>=7)s++;if(num(d.water)>=waterT())s++;
  if(d.protein==='yes')s++;if(d.food==='yes')s++;else if(d.food==='mostly')s+=0.5;return s}
function scoreHTML(d){const sc=dayScore(d);return `<div class="habitbar">${Array.from({length:HABIT_N},(_,i)=>`<span class="${sc>=i+1?'on':sc>i?'half':''}"></span>`).join('')}</div><div class="small mut" style="text-align:center">${sc}/${HABIT_N} habits hit${sc>=4?' · solid day':''}</div>`}
function segH(key,opts,val,cls){return `<div class="seg ${cls||''}" data-dayseg="${key}">${opts.map(([v,l])=>`<button data-v="${v}" class="${String(val)===String(v)?'on':''}">${l}</button>`).join('')}</div>`}

function setDay(k,v){const d=Object.assign({},S.daily[DAY]||{});if(v===''||v==null)delete d[k];else d[k]=v;

function chart(series,{h=170,unit=''}={}){
  const W=340,H=h,P={l:38,r:10,t:12,b:22};const all=series.flatMap(s=>s.pts);
  if(!all.length)return '<p class="small mut">No data yet.</p>';
  let x0=Math.min(...all.map(p=>p.x)),x1=Math.max(...all.map(p=>p.x));if(x1-x0<864e5*4){x0-=864e5*2;x1+=864e5*2}
  let y0=Math.min(...all.map(p=>p.y)),y1=Math.max(...all.map(p=>p.y));const pd=(y1-y0)*0.15||Math.max(1,y1*0.02);y0-=pd;y1+=pd;
  const X=x=>P.l+(x-x0)/(x1-x0)*(W-P.l-P.r),Y=y=>P.t+(1-(y-y0)/(y1-y0))*(H-P.t-P.b);
  let g='';for(let i=0;i<=3;i++){const v=y0+(y1-y0)*i/3;g+=`<line x1="${P.l}" x2="${W-P.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="#2a2e34" stroke-width="1"/><text x="${P.l-6}" y="${Y(v)+3}" text-anchor="end">${(y1-y0)>50?Math.round(v):Math.round(v*10)/10}</text>`}
  const dl=x=>new Date(x).toLocaleDateString('en-GB',{day:'numeric',month:'short'});
  g+=`<text x="${P.l}" y="${H-6}">${dl(x0)}</text><text x="${W-P.r}" y="${H-6}" text-anchor="end">${dl(x1)}</text>`;
  series.forEach(s=>{const pts=[...s.pts].sort((a,b)=>a.x-b.x);
    if(s.line&&pts.length>1)g+=`<path d="${pts.map((p,i)=>(i?'L':'M')+X(p.x).toFixed(1)+' '+Y(p.y).toFixed(1)).join(' ')}" fill="none" stroke="${s.color}" stroke-width="${s.w||2.5}" stroke-linejoin="round" stroke-linecap="round"/>`;
    if(s.dots)pts.forEach(p=>g+=`<circle cx="${X(p.x).toFixed(1)}" cy="${Y(p.y).toFixed(1)}" r="${s.r||3}" fill="${s.color}"/>`)});
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">${g}</svg>`;
}

const mk=(slot,a,note)=>({slot,name:a[0],kcal:a[1],p:a[2],c:a[3],f:a[4],note:note||'',eaten:false});
function mealTargets(){const t=targets();return t?{kcal:t.kcal,p:t.protein,c:t.carbs,f:t.fat}:{kcal:2350,p:170,c:260,f:70}}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function dayTot(d,eatenOnly){const t={kcal:0,p:0,c:0,f:0};(d.meals||[]).forEach(m=>{if(eatenOnly&&!m.eaten)return;t.kcal+=+m.kcal||0;t.p+=+m.p||0;t.c+=+m.c||0;t.f+=+m.f||0});return t}
function topUp(day,T){ // add snacks until protein and calories are near target
  const used=new Set();const add=i=>{used.add(i);day.meals.push(mk('Snack',LIB.sn[i]))};
  for(const i of [0,1,2,4]){const t=dayTot(day);if(t.p>=T.p-8||t.kcal+LIB.sn[i][1]>T.kcal+120)break;add(i)}
  for(const i of [2,3,1]){const t=dayTot(day);if(t.kcal>=T.kcal-180)break;if(!used.has(i))add(i)}
}
function genPlan(){
  const T=mealTargets(),prep=shuffle(LIB.main.filter(m=>m[5])),all=shuffle(LIB.main);
  const lunch=prep.slice(0,3),rest=all.filter(m=>!lunch.includes(m));let ri=0;const nx=()=>rest[ri++%rest.length];
  const days=DAYS.map((d,i)=>{const meals=[mk('Breakfast',LIB.bf[i%LIB.bf.length])];
    if(i<5)meals.push(mk('Lunch',lunch[i%3],'Batch-cooked · packs and reheats well'));
    else meals.push(mk('Lunch',nx()));
    meals.push(mk('Dinner',nx()));
    const day={d,meals};topUp(day,T);return day});
  const cook={};days.forEach(d=>d.meals.forEach(m=>{if(m.slot==='Lunch'||m.slot==='Dinner'){if(m.name.startsWith('Work restaurant'))return;cook[m.name]=(cook[m.name]||0)+1}}));
  const cnt=n=>days.reduce((a,d)=>a+d.meals.filter(m=>m.name===n).length,0);
  const shopping=[...Object.entries(cook).map(([n,k])=>({item:n,qty:k+' serving'+(k>1?'s':'')+'',cat:'Recipes to cook',done:false})),
    {item:'Eggs',qty:String(cnt(LIB.bf[0][0])*3+cnt(LIB.bf[2][0])*2+cnt(LIB.sn[1][0])*2),cat:'Staples',done:false},
    {item:'Plain yoghurt',qty:(cnt(LIB.bf[1][0])*2+cnt(LIB.sn[2][0])*2)+' pots',cat:'Staples',done:false},
    {item:'Canned tuna in water',qty:cnt(LIB.sn[0][0])+' cans (≈120 g drained each)',cat:'Staples',done:false},
    {item:'Bread',qty:'≈'+(cnt(LIB.bf[0][0])*60+cnt(LIB.bf[2][0])*60+cnt(LIB.sn[0][0])*40)+' g for breakfasts and snacks',cat:'Staples',done:false},
    {item:'Oats, bananas, almonds, dates, fruit, turkey slices, tomatoes',qty:'top up as needed',cat:'Staples',done:false}].filter(x=>!/^0( |$)/.test(x.qty));
  return{weekOf:mondayOf(todayISO()),by:'Quick plan',targets:T,days,shopping,notes:'',updatedAt:Date.now()};
}
function validPlan(o){ // accept a plan from Claude or a paste; returns clean plan or null
  if(!o||!Array.isArray(o.days)||!o.days.length)return null;
  const n=v=>Math.max(0,Math.round(parseFloat(v)||0));
  const days=DAYS.map((d,i)=>{const src=o.days.find(x=>String(x.d||x.day||'').slice(0,3).toLowerCase()===d.toLowerCase())||o.days[i]||{meals:[]};
    return{d,meals:(src.meals||[]).slice(0,8).map(m=>({slot:String(m.slot||'Meal').slice(0,20),name:String(m.name||'').slice(0,140),kcal:n(m.kcal),p:n(m.p??m.protein),c:n(m.c??m.carbs),f:n(m.f??m.fat),note:String(m.note||'').slice(0,200),eaten:!!m.eaten})).filter(m=>m.name)}});
  if(!days.some(d=>d.meals.length))return null;
  return{weekOf:mondayOf(todayISO()),by:String(o.by||'Claude').slice(0,30),targets:mealTargets(),days,
    shopping:(Array.isArray(o.shopping)?o.shopping:[]).slice(0,120).map(x=>typeof x==='string'?{item:x,qty:'',cat:'',done:false}:{item:String(x.item||'').slice(0,100),qty:String(x.qty||'').slice(0,80),cat:String(x.cat||'').slice(0,40),done:!!x.done}).filter(x=>x.item),
    notes:String(o.notes||'').slice(0,600),updatedAt:Date.now()};
}

   case 'rmset':{const ex=D.ex[+a.dataset.e];if(ex.sets.length>1)ex.sets.pop();refreshCard(+a.dataset.e);saveDraft();break}
   case 'swap':{const i=+a.dataset.e,ex=D.ex[i],E0=EX[ex.slot];const opts=[ex.slot,...E0.swaps].filter((v,k,arr)=>arr.indexOf(v)===k);
     openSheet(`<div class="h title" style="font-size:26px">Swap ${esc(EX[ex.id].n)}</div><p class="small mut">Machine taken or missing? Pick an alternative. Progress is tracked per exercise.</p>${opts.map(id=>`<button class="lib-item" data-act="swap2" data-e="${i}" data-ex="${id}"><span><b>${esc(EX[id].n)}</b>${id===ex.slot?' <span class="pill">original</span>':''}<div class="tiny mut">${esc(EX[id].m)}</div></span><span class="${id===ex.id?'acc':'mut'}">${id===ex.id?'current':'›'}</span></button>`).join('')}`);break}
   case 'swap2':{const i=+a.dataset.e,ex=D.ex[i],id=a.dataset.ex;if(id!==ex.id){ex.id=id;const sg=suggest(id,ex.lo,ex.hi);ex.sets.forEach(s=>{if(!s.done){s.w=sg.w!=null&&!EX[id].timed?fmtW(sg.w):'';s.r=''}})}closeSheet();refreshCard(i);saveDraft();break}
   case 'cardio':D.cardio.done=!D.cardio.done;saveDraft();renderWorkout();break;
   case 't-15':T.end-=15000;if(T.end<Date.now())T.end=Date.now();if(!T.iv){T.iv=setInterval(tickTimer,250)}tickTimer();break;
   case 't+15':T.end=Math.max(T.end,Date.now())+15000;T.dur+=15;$('#timer').classList.remove('go');clearTimeout(T.hide);if(!T.iv){T.iv=setInterval(tickTimer,250)}tickTimer();break;
   case 'tskip':stopTimer();break;
  }
});
document.addEventListener('input',e=>{
  const t=e.target,D=S.draft;
  if(t.dataset.day){const v=num(t.value);setDay(t.dataset.day,isNaN(v)?'':v);return}
  if(t.dataset.dayw!=null){setDayWeight(t.value);return}
  if(t.dataset.k&&D){const ex=D.ex[+t.dataset.e];if(!ex)return;ex.sets[+t.dataset.s][t.dataset.k]=t.value;saveDraft();return}
  if(t.dataset.note!=null){const v=t.value.trim();if(v)S.notes[t.dataset.note]=v;else delete S.notes[t.dataset.note];saveProfile();return}
  if(t.dataset.sessnote!=null&&D){D.notes=t.value;saveDraft();return}
  if(t.dataset.cardio&&D){D.cardio.min=t.value;saveDraft();return}
});
document.addEventListener('change',e=>{const t=e.target;
  if(t.dataset.meat!=null&&S.meal){S.meal.days[MDAY].meals[+t.dataset.meat].eaten=t.checked;saveMeal();
    if(MDAY===(new Date().getDay()+6)%7&&DAY===todayISO()){const et=dayTot(S.meal.days[MDAY],true),T=mealTargets();if(et.p>=T.p-8&&(S.daily[DAY]||{}).protein!=='yes')setDay('protein','yes')}
    renderAll();return}
  if(t.dataset.shop!=null&&S.meal){S.meal.shopping[+t.dataset.shop].done=t.checked;saveMeal();return}if(t.dataset.warm!=null&&S.draft){S.draft.warm[t.dataset.warm]=t.checked;saveDraft()}});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&T.iv)tickTimer()});

/* boot */
function migrate(){if(S.profile&&!S.profile.ul4){S.profile.days=4;S.profile.ul4=1;saveProfile();return true}return false}
lsLoad();migrate();setStatus('loading');renderAll();
if('serviceWorker' in navigator&&location.protocol==='https:'){navigator.serviceWorker.register('sw.js').catch(()=>{})}
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
initRemote();
</script>
